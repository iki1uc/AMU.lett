<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AMU · SONNE · MOND · PANDORA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070e; overflow:hidden;
              font-family:'Consolas',monospace; color:#c0d0d0; }
  canvas { display:block; position:fixed; inset:0; }
  #ui { position:fixed; inset:0; pointer-events:none;
        display:flex; flex-direction:column; justify-content:space-between;
        padding:24px; }
  #oben { display:flex; justify-content:space-between; font-size:11px;
          letter-spacing:2px; opacity:0.55; }
  #unten { display:flex; flex-direction:column; align-items:center; gap:12px; }
  #axiome { display:flex; gap:24px; font-size:11px; opacity:0.7; }
  #axiome b { color:#ffd700; font-weight:700; }
  #verben { display:flex; gap:10px; pointer-events:auto; }
  button { background:rgba(0,0,0,0.5); border:1px solid #222;
           color:#8aa8a0; padding:8px 18px; border-radius:100px;
           font-family:inherit; font-size:11px; cursor:pointer;
           transition:0.3s; letter-spacing:1px; }
  button:hover { border-color:#ffd700; color:#ffd700; }
  button[data-verb="abgeben"]:hover { border-color:#f5a342; color:#f5a342; }
  button[data-verb="holen"]:hover   { border-color:#4dd0e1; color:#4dd0e1; }
  button[data-verb="nutzen"]:hover  { border-color:#a78bfa; color:#a78bfa; }
  #pandora-state { font-size:10px; opacity:0.5; letter-spacing:2px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div id="oben">
    <span>☀ SONNE · x · entfesselt</span>
    <span>☾ MOND · y · fesselt</span>
  </div>
  <div id="unten">
    <div id="axiome">
      <span>x <b id="vx">0.000</b></span>
      <span>y <b id="vy">0</b></span>
      <span>q <b id="vq">0.000</b></span>
      <span>c <b id="vc">0.000</b></span>
    </div>
    <div id="verben">
      <button data-verb="abgeben">◉ abgeben</button>
      <button data-verb="holen">◇ holen</button>
      <button data-verb="nutzen">★ nutzen</button>
    </div>
    <div id="pandora-state">PANDORA · geschlossen</div>
  </div>
</div>

<script src="./co.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

let t = 0, last = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += dt;

  // ─── Zen-Hintergrund atmet (12s-Zyklus) ────────
  const atem = 0.5 + 0.5 * Math.sin(t * 0.5);
  ctx.fillStyle = `rgb(${5 + atem*4}, ${7 + atem*6}, ${14 + atem*8})`;
  ctx.fillRect(0, 0, W, H);

  const cx = W/2, cy = H/2;
  const z = window.CO ? CO.zustand() : {
    sonne:{staerke:0.5}, mond:{staerke:0,groesse:0},
    pandora:{offen:false,zyklen:0}, kette:{spannung:1},
    axiom:{x:0,y:0,q:0.5,c:0}
  };

  // ─── SONNE (links) ─────────────────────────────
  const sx = cx - W*0.22, sy = cy;
  const sr = 40 + z.sonne.staerke * 40;
  let g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr*3);
  g.addColorStop(0, `rgba(255,200,100,${0.8*z.sonne.staerke})`);
  g.addColorStop(0.5, `rgba(245,163,66,${0.3*z.sonne.staerke})`);
  g.addColorStop(1, 'rgba(245,163,66,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sx, sy, sr*3, 0, Math.PI*2); ctx.fill();

  // Mana-Strahlen nur wenn Pandora offen
  if (z.pandora.offen) {
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2 + t*0.3;
      const r1 = sr, r2 = sr + 60 + Math.sin(t*3 + i)*20;
      ctx.strokeStyle = 'rgba(255,200,100,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a)*r1, sy + Math.sin(a)*r1);
      ctx.lineTo(sx + Math.cos(a)*r2, sy + Math.sin(a)*r2);
      ctx.stroke();
    }
  }

  // ─── MOND (rechts) ─────────────────────────────
  const mx = cx + W*0.22, my = cy;
  const mr = 30 + (z.mond.groesse || 0) * 3;
  g = ctx.createRadialGradient(mx, my, 0, mx, my, mr*3);
  g.addColorStop(0, 'rgba(180,220,255,0.6)');
  g.addColorStop(0.5, 'rgba(77,208,225,0.15)');
  g.addColorStop(1, 'rgba(77,208,225,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx, my, mr*3, 0, Math.PI*2); ctx.fill();

  // Aura-Ringe — einer pro anderem Tab
  for (let i = 0; i < (z.mond.groesse || 0); i++) {
    ctx.strokeStyle = `rgba(180,220,255,${0.3 - i*0.04})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mx, my, mr + 8 + i*6, 0, Math.PI*2); ctx.stroke();
  }

  // ─── KETTE ─────────────────────────────────────
  const glieder = 12;
  for (let i = 0; i < glieder; i++) {
    const p = i / (glieder - 1);
    const lx = sx + (mx - sx) * p;
    const ly = sy + (my - sy) * p + Math.sin(p*Math.PI + t*2) * 4;
    const welle = Math.sin(p*Math.PI*3 + t*4) * 0.5 + 0.5;
    const alpha = (z.pandora.offen ? 0.5 : 0.2) * welle;
    ctx.fillStyle = `rgba(167,139,250,${alpha})`;
    ctx.beginPath(); ctx.arc(lx, ly, 2, 0, Math.PI*2); ctx.fill();
  }

  // ─── PANDORA (Mitte, Dosenöffner) ──────────────
  const pr = 14 + z.axiom.q * 10;
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, pr*2.5);
  if (z.pandora.offen) {
    g.addColorStop(0, 'rgba(255,215,0,0.9)');
    g.addColorStop(1, 'rgba(255,215,0,0)');
  } else {
    g.addColorStop(0, 'rgba(80,80,100,0.6)');
    g.addColorStop(1, 'rgba(80,80,100,0)');
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, pr*2.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = z.pandora.offen ? '#ffd700' : '#2a2a3a';
  ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI*2); ctx.fill();

  // ─── UI-Texte ──────────────────────────────────
  document.getElementById('vx').textContent = z.axiom.x.toFixed(3);
  document.getElementById('vy').textContent = z.axiom.y;
  document.getElementById('vq').textContent = z.axiom.q.toFixed(3);
  document.getElementById('vc').textContent = z.axiom.c.toFixed(3);
  document.getElementById('pandora-state').textContent =
    'PANDORA · ' + (z.pandora.offen ? 'OFFEN' : 'geschlossen')
    + ' · zyklen ' + z.pandora.zyklen;
}
requestAnimationFrame(loop);

// ─── VERBEN ──────────────────────────────────────
document.querySelectorAll('[data-verb]').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (window.CO && CO[btn.dataset.verb]) await CO[btn.dataset.verb]();
  });
});
</script>
</body>
</html>
